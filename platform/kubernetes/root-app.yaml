apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: aws-gitops-platform
spec:
  project: default
  source:
    repoURL: https://github.com/Pavankp1010101010/Aws-gitOps-platform.git
    targetRevision: main
    path: platform/kubernetes/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-smoke
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
