apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - manifests/application-servicemonitor.yaml
  - manifests/application-alert-rules.yaml
configMapGenerator:
  - name: monitoring-dashboards
    files:
      - dashboards/application.json
      - dashboards/host.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: aws-gitops-platform
