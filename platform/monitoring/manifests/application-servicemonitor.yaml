apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: support-ticket
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - support-ticket
  selector:
    matchLabels:
      app.kubernetes.io/instance: support-ticket
      app.kubernetes.io/name: support-ticket
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
