name: ECR credential-provider smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  publish-smoke-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate repository deployment variables
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ||
                ! "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ||
                ! "$AWS_PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/.+ ||
                ! "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::Set AWS_ACCOUNT_ID, AWS_REGION, AWS_PUBLISH_ROLE_ARN, and ECR_REPOSITORY as repository Actions variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.AWS_PUBLISH_ROLE_ARN }}
          role-session-name: stage05-ecr-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the assumed AWS account
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Expected AWS account ${AWS_ACCOUNT_ID}, got ${account}"
            exit 1
          fi

      - name: Log in to the private ECR registry
        shell: bash
        run: |
          set -euo pipefail
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"
          echo "ECR_REGISTRY=$registry" >> "$GITHUB_ENV"

      - name: Build and publish an immutable smoke image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          tag="stage05-${GITHUB_RUN_ID}"
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          docker build --file application/Dockerfile --tag "$image" application
          docker push "$image"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "$digest" != "None"
          echo "image_uri=$image" >> "$GITHUB_OUTPUT"
          echo "Published immutable smoke image: ${image}@${digest}"
