name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-ci:
    name: Application tests and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: ticket_app
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: ticket_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_app -d ticket_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ticket_app:ci-ephemeral-password@127.0.0.1:55432/ticket_test
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: application/.nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: application
        run: npm ci --ignore-scripts
      - name: Syntax and integration checks
        working-directory: application
        run: |
          npm run check
          npm test
      - name: Validate GitOps Helm charts
        shell: bash
        run: |
          set -euo pipefail
          version="3.18.6"
          archive="helm-v${version}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/${archive}" --output "$RUNNER_TEMP/$archive"
          echo "3f43c0aa57243852dd542493a0f54f1396c0bc8ec7296bbb2c01e802010819ce  $RUNNER_TEMP/$archive" |
            sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/linux-amd64/helm" lint --strict platform/kubernetes/charts/support-ticket
          "$RUNNER_TEMP/linux-amd64/helm" template support-ticket \
            platform/kubernetes/charts/support-ticket \
            --namespace support-ticket > "$RUNNER_TEMP/support-ticket-rendered.yaml"
          bash platform/tests/validate-chart.sh "$RUNNER_TEMP/support-ticket-rendered.yaml"
          "$RUNNER_TEMP/linux-amd64/helm" repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          "$RUNNER_TEMP/linux-amd64/helm" repo update prometheus-community
          "$RUNNER_TEMP/linux-amd64/helm" pull prometheus-community/kube-prometheus-stack \
            --version 92.16.1 --untar --untardir "$RUNNER_TEMP"
          "$RUNNER_TEMP/linux-amd64/helm" lint "$RUNNER_TEMP/kube-prometheus-stack" \
            --values platform/monitoring/values.yaml
          "$RUNNER_TEMP/linux-amd64/helm" template monitoring \
            "$RUNNER_TEMP/kube-prometheus-stack" --namespace monitoring \
            --include-crds --values platform/monitoring/values.yaml \
            > "$RUNNER_TEMP/monitoring-chart-rendered.yaml"
          kubectl kustomize platform/kubernetes/cluster \
            > "$RUNNER_TEMP/cluster-gitops-rendered.yaml"
          grep -q 'ServerSideApply=true' "$RUNNER_TEMP/cluster-gitops-rendered.yaml"
          kubectl kustomize platform/monitoring \
            > "$RUNNER_TEMP/monitoring-gitops-rendered.yaml"
          bash platform/tests/validate-monitoring.sh \
            "$RUNNER_TEMP/monitoring-chart-rendered.yaml" \
            "$RUNNER_TEMP/monitoring-gitops-rendered.yaml"
          bash -n platform/monitoring/install-sns-webhook.sh
          prometheus_version="3.5.0"
          prometheus_archive="prometheus-${prometheus_version}.linux-amd64.tar.gz"
          prometheus_url="https://github.com/prometheus/prometheus/releases/download/v${prometheus_version}"
          generated_rules="platform/monitoring/tests/generated-alert-rules.yml"
          trap 'rm -f "$generated_rules"' EXIT
          curl --fail --location --silent --show-error \
            "$prometheus_url/$prometheus_archive" --output "$RUNNER_TEMP/$prometheus_archive"
          curl --fail --location --silent --show-error \
            "$prometheus_url/sha256sums.txt" --output "$RUNNER_TEMP/prometheus-sha256sums.txt"
          expected_sha="$(awk -v archive="$prometheus_archive" '$2 == archive { print $1 }' "$RUNNER_TEMP/prometheus-sha256sums.txt")"
          test -n "$expected_sha"
          echo "$expected_sha  $RUNNER_TEMP/$prometheus_archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$prometheus_archive" -C "$RUNNER_TEMP"
          python3 platform/monitoring/tests/extract-prometheus-rules.py \
            platform/monitoring/manifests/application-alert-rules.yaml "$generated_rules"
          "$RUNNER_TEMP/prometheus-${prometheus_version}.linux-amd64/promtool" \
            test rules platform/monitoring/tests/alerts.test.yml
          python3 -m unittest discover -s platform/tests -p "test_update_image_digest.py"
          python3 -m unittest discover -s platform/monitoring -p "test_sns_webhook.py"
          node --check platform/tests/smoke-test.mjs
          node --test platform/tests/smoke-test.test.mjs
      - name: Verify test-runner failure propagation
        shell: bash
        run: |
          if node --test platform/tests/fixtures/intentional-failure.mjs; then
            echo "::error::A failing test unexpectedly returned success"
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "::error::Runner returned unexpected code $result"
              exit 1
            fi
          fi
      - name: Build non-root application image
        run: docker build --tag support-ticket-tracker:ci application
      - name: Export image for scanner
        run: |
          mkdir -p .cache/scan .cache/trivy
          docker save --output .cache/scan/application.tar support-ticket-tracker:ci
      - name: Verify scan-policy fixtures offline
        shell: bash
        run: |
          docker pull "$TRIVY_IMAGE"
          if docker run --rm --network none -v "$GITHUB_WORKSPACE/platform/tests/fixtures:/fixtures:ro" "$TRIVY_IMAGE" convert --severity HIGH,CRITICAL --exit-code 1 /fixtures/trivy-high.json; then
            echo "::error::HIGH fixture unexpectedly passed"
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "::error::Fixture check failed with unexpected code $result"
              exit 1
            fi
          fi
          docker run --rm --network none -v "$GITHUB_WORKSPACE/platform/tests/fixtures:/fixtures:ro" "$TRIVY_IMAGE" convert --severity HIGH,CRITICAL --exit-code 1 /fixtures/trivy-low.json
      - name: Scan image - block HIGH and CRITICAL
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/.cache/scan:/scan:ro" \
            -v "$GITHUB_WORKSPACE/.cache/trivy:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m \
            --input /scan/application.tar
