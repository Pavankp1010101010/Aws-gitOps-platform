name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-ci:
    name: Application tests and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: ticket_app
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: ticket_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_app -d ticket_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ticket_app:ci-ephemeral-password@127.0.0.1:55432/ticket_test
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: application/.nvmrc
      - name: Install locked dependencies
        working-directory: application
        run: npm ci --ignore-scripts
      - name: Syntax and integration checks
        working-directory: application
        run: |
          npm run check
          npm test
      - name: Verify test-runner failure propagation
        shell: bash
        run: |
          if node --test platform/tests/fixtures/intentional-failure.mjs; then
            echo "::error::A failing test unexpectedly returned success"
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "::error::Runner returned unexpected code $result"
              exit 1
            fi
          fi
      - name: Build non-root application image
        run: docker build --tag support-ticket-tracker:ci application
      - name: Export image for scanner
        run: |
          mkdir -p .cache/scan .cache/trivy
          docker save --output .cache/scan/application.tar support-ticket-tracker:ci
      - name: Verify scan-policy fixtures offline
        shell: bash
        run: |
          docker pull "$TRIVY_IMAGE"
          if docker run --rm --network none -v "$GITHUB_WORKSPACE/platform/tests/fixtures:/fixtures:ro" "$TRIVY_IMAGE" convert --severity HIGH,CRITICAL --exit-code 1 /fixtures/trivy-high.json; then
            echo "::error::HIGH fixture unexpectedly passed"
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              echo "::error::Fixture check failed with unexpected code $result"
              exit 1
            fi
          fi
          docker run --rm --network none -v "$GITHUB_WORKSPACE/platform/tests/fixtures:/fixtures:ro" "$TRIVY_IMAGE" convert --severity HIGH,CRITICAL --exit-code 1 /fixtures/trivy-low.json
      - name: Scan image - block HIGH and CRITICAL
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/.cache/scan:/scan:ro" \
            -v "$GITHUB_WORKSPACE/.cache/trivy:/cache" \
            "$TRIVY_IMAGE" image --cache-dir /cache --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m \
            --input /scan/application.tar
